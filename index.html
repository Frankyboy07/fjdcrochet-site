---
layout: default
title: Home
---

<style>
  .grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
    gap: 1.5rem; 
    margin-top: 2rem; 
  }
  .card { 
    background: #fff; 
    border: 1px solid #e4e4e7; 
    border-radius: 12px; 
    overflow: hidden; 
    text-decoration: none; 
    color: inherit; 
    transition: transform 0.2s; 
    display: block;
  }
  .card:hover { 
    transform: translateY(-4px); 
  }
  .card img { 
    width: 100%; 
    height: 240px; 
    object-fit: cover; 
    display: block;
  }
  .card-body { 
    padding: 1rem; 
  }
  .card-body h3 {
    margin: 0 0 0.5rem 0;
    color: #d97706;
  }
  .card-body p {
    margin: 0;
    font-size: 0.95rem;
    color: #4b5563;
  }
</style>

<div class="grid">
  {% for project in site.projects %}
    <a href="{{ project.url | relative_url }}" class="card">
      {% if project.featured_image %}
        <img src="{{ project.featured_image | relative_url }}" alt="{{ project.title }}">
      {% endif %}
      <div class="card-body">
        <h3>{{ project.title }}</h3>
        {% if project.summary %}
          <p>{{ project.summary }}</p>
        {% endif %}
      </div>
    </a>
  {% endfor %}
</div>
