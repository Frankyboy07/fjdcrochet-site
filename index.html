<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FJD Crochet</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; background: #fdfbf7; }
    h1 { color: #d97706; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .card { background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 240px; object-fit: cover; }
    .card-body { padding: 1rem; }
  </style>
</head>
<body>
  <h1>FJD Crochet</h1>
  <div class="grid">
    {% for project in site.projects %}
      <a href="{{ project.url }}" class="card">
        <img src="{{ project.featured_image }}" alt="{{ project.title }}">
        <div class="card-body">
          <h3>{{ project.title }}</h3>
          <p>{{ project.summary }}</p>
        </div>
      </a>
    {% endfor %}
  </div>
</body>
</html>
